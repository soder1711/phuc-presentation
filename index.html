<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Защита достоинства работников</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
            --navy:#1f3a5f;
            --navy-deep:#15263f;
            --gold:#c9a96e;
            --gold-bright:#e0c388;
            --paper:#fafbfc;
            --gray:#3c3c3c;
            --gray-soft:#6b7280;
            --accent:#3a6ea5;
            --accent-soft:#dce7f2;
            --red:#c25450;
            --green:#5a8a6b;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%}
        body{
            font-family:'Manrope',system-ui,sans-serif;
            background:#080d16;
            color:#1c1c1c;
            overflow:hidden;
            height:100vh;width:100vw;
        }
        .deck{
            width:100vw;height:100vh;position:relative;
            display:flex;align-items:center;justify-content:center;
        }
        .slide{
            width:min(100vw,177.78vh);
            aspect-ratio:16/9;
            background:var(--paper);
            position:absolute;
            box-shadow:0 40px 100px rgba(0,0,0,.55);
            overflow:hidden;
            display:none;
            flex-direction:column;
            border-radius:8px;
        }
        .slide.active{display:flex;animation:slideIn .65s cubic-bezier(.22,.61,.36,1)}
        .slide.exit-left{animation:exitL .4s ease-in forwards}
        .slide.exit-right{animation:exitR .4s ease-in forwards}
        @keyframes slideIn{0%{opacity:0;transform:translateX(70px) scale(.95)}100%{opacity:1;transform:translateX(0) scale(1)}}
        @keyframes exitL{0%{opacity:1}100%{opacity:0;transform:translateX(-70px) scale(.95)}}
        @keyframes exitR{0%{opacity:1}100%{opacity:0;transform:translateX(70px) scale(.95)}}
        @keyframes fadeUp{0%{opacity:0;transform:translateY(28px)}100%{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
        @keyframes slideRight{0%{opacity:0;transform:translateX(-40px)}100%{opacity:1;transform:translateX(0)}}
        @keyframes growW{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
        @keyframes float1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,30px) scale(1.2)}}
        @keyframes float2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-30px,-20px) scale(1.15)}}
        @keyframes bgpan{0%{background-position:0 0}100%{background-position:600px 600px}}
        @keyframes ribbonGrow{0%{width:0;opacity:0}100%{width:18vw;opacity:1}}

        .slide.title{
            background:linear-gradient(135deg,#0c1a30 0%,#1f3a5f 55%,#2a5080 100%);
            color:#fff;justify-content:center;align-items:center;text-align:center;
        }
        .slide.title .bg-pattern{
            position:absolute;inset:0;opacity:.08;
            background-image:repeating-linear-gradient(45deg,transparent,transparent 60px,rgba(201,169,110,.5) 60px,rgba(201,169,110,.5) 61px);
            animation:bgpan 30s linear infinite;
        }
        .slide.title .glow1{
            position:absolute;width:50%;height:60%;top:-10%;left:-10%;
            background:radial-gradient(circle,rgba(58,110,165,.4),transparent 70%);
            filter:blur(40px);animation:float1 10s ease-in-out infinite alternate;
        }
        .slide.title .glow2{
            position:absolute;width:45%;height:55%;bottom:-10%;right:-10%;
            background:radial-gradient(circle,rgba(201,169,110,.2),transparent 70%);
            filter:blur(50px);animation:float2 12s ease-in-out infinite alternate;
        }
        .title-eyebrow{
            font-family:'JetBrains Mono',monospace;font-size:.85vw;letter-spacing:.3em;
            text-transform:uppercase;color:var(--gold);
            animation:fadeIn .8s .2s both;
            margin-bottom:2.5vh;
            display:flex;align-items:center;gap:1vw;z-index:2;
        }
        .title-eyebrow::before,.title-eyebrow::after{
            content:"";width:3vw;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
        }
        .slide.title h1{
            font-family:'Playfair Display',serif;font-size:2.6vw;line-height:1.25;font-weight:800;
            max-width:75%;animation:fadeUp 1s .35s both;
            text-shadow:0 4px 30px rgba(0,0,0,.4);z-index:2;
        }
        .slide.title .ribbon{
            margin:3.5vh auto 0;height:3px;
            background:linear-gradient(90deg,transparent,var(--gold),transparent);
            animation:ribbonGrow 1s .6s both;z-index:2;
        }
        .slide.title .subtitle{
            margin-top:3vh;font-size:1.1vw;color:#b8c6d8;letter-spacing:.08em;font-weight:300;
            animation:fadeUp .8s .8s both;z-index:2;
        }
        .slide.title .footer-row{
            position:absolute;bottom:5vh;left:0;right:0;
            display:flex;justify-content:space-between;padding:0 5vw;
            font-size:.8vw;color:#7a93b0;letter-spacing:.1em;
            animation:fadeIn .8s 1.2s both;z-index:2;
        }

        .content-header{
            display:flex;align-items:center;gap:1.5vw;
            padding:3.2vh 4vw 2.5vh;
            border-bottom:1px solid #e2e8f0;
            position:relative;z-index:2;
        }
        .slide-num{
            font-family:'Playfair Display',serif;font-size:2.4vw;font-weight:800;
            color:var(--navy);line-height:1;animation:fadeUp .5s .1s both;position:relative;
        }
        .slide-num::after{
            content:"";position:absolute;left:0;bottom:-4px;width:100%;height:3px;
            background:var(--gold);transform-origin:left;animation:growW .5s .3s both;
        }
        .content-header h2{
            font-family:'Playfair Display',serif;font-size:1.75vw;font-weight:700;
            color:var(--navy-deep);letter-spacing:-.01em;line-height:1.2;
            animation:fadeUp .5s .25s both;
        }
        .content-header .tag{
            margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:.7vw;
            color:var(--gray-soft);letter-spacing:.15em;text-transform:uppercase;
            background:#f4f6f8;padding:.5vh 1vw;border-radius:20px;border:1px solid #e2e8f0;
            animation:fadeIn .5s .4s both;
        }
        .content-body{flex:1;padding:3vh 4vw 5vh;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2;}

        .bg-layer{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
        .bg-s2{background:radial-gradient(circle at 88% 15%, rgba(58,110,165,.08), transparent 35%),radial-gradient(circle at 5% 85%, rgba(201,169,110,.06), transparent 30%)}
        .bg-s3{background:linear-gradient(180deg, rgba(58,110,165,.04), transparent 40%),radial-gradient(circle at 92% 80%, rgba(61,139,139,.06), transparent 35%)}
        .bg-s4{background:radial-gradient(circle at 10% 20%, rgba(201,169,110,.07), transparent 30%),radial-gradient(circle at 90% 60%, rgba(31,58,95,.06), transparent 35%)}
        .bg-s5{background:radial-gradient(circle at 50% 50%, rgba(58,110,165,.05), transparent 60%)}
        .bg-s6{background:linear-gradient(135deg, rgba(201,169,110,.04) 0%, transparent 50%),radial-gradient(circle at 85% 90%, rgba(90,138,107,.06), transparent 35%)}
        .bg-s7{background:radial-gradient(circle at 15% 75%, rgba(194,84,80,.06), transparent 35%),radial-gradient(circle at 80% 20%, rgba(31,58,95,.05), transparent 30%)}
        .bg-s8{background:linear-gradient(180deg, rgba(90,138,107,.04), transparent 50%),radial-gradient(circle at 70% 30%, rgba(58,110,165,.06), transparent 35%)}
        .bg-s9{background:radial-gradient(circle at 20% 30%, rgba(201,169,110,.07), transparent 35%),radial-gradient(circle at 80% 70%, rgba(58,110,165,.05), transparent 30%)}
        .bg-s10{background:radial-gradient(circle at 90% 10%, rgba(31,58,95,.08), transparent 30%),linear-gradient(180deg, rgba(58,110,165,.03), transparent 40%)}
        .bg-s11{background:radial-gradient(circle at 10% 90%, rgba(194,84,80,.06), transparent 35%),radial-gradient(circle at 60% 20%, rgba(201,169,110,.05), transparent 30%)}
        .bg-s12{background:linear-gradient(135deg, rgba(90,138,107,.05) 0%, transparent 50%),radial-gradient(circle at 85% 85%, rgba(201,169,110,.06), transparent 35%)}
        .bg-s13{background:radial-gradient(circle at 50% 0%, rgba(58,110,165,.06), transparent 40%)}
        .bg-s14{background:radial-gradient(circle at 15% 85%, rgba(201,169,110,.08), transparent 35%)}

        .card-grid{display:grid;gap:1.8vh 1.6vw;width:100%}
        .card-grid.cols-1{grid-template-columns:1fr;gap:1.5vh}
        .card-grid.cols-2{grid-template-columns:1fr 1fr}
        .card-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
        .card-grid.cols-4{grid-template-columns:1fr 1fr 1fr 1fr}

        .card{
            background:#fff;border:1px solid #e2e8f0;border-radius:10px;
            padding:2vh 1.5vw;position:relative;overflow:hidden;
            opacity:0;animation:fadeUp .5s both;
            transition:transform .25s,box-shadow .25s,border-color .25s;
        }
        .card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(31,58,95,.12);border-color:var(--accent)}
        .card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--navy),var(--accent));opacity:0;transition:opacity .25s}
        .card:hover::before{opacity:1}
        .card .card-icon{font-family:'JetBrains Mono',monospace;font-size:.7vw;font-weight:500;color:var(--gold);letter-spacing:.1em;margin-bottom:.8vh}
        .card .card-title{font-size:1.05vw;font-weight:700;color:var(--navy-deep);line-height:1.3;margin-bottom:.6vh}
        .card .card-text{font-size:.85vw;line-height:1.55;color:var(--gray);font-weight:400}
        .card .card-text strong{color:var(--navy);font-weight:600}

        .info-list{display:flex;flex-direction:column;gap:1.5vh;width:100%}
        .info-row{
            display:flex;gap:1.5vw;align-items:flex-start;
            padding:1.5vh 0;border-bottom:1px solid #eef2f6;
            opacity:0;animation:slideRight .5s both;
        }
        .info-row:last-child{border-bottom:none}
        .info-row .row-num{font-family:'Playfair Display',serif;font-size:1.4vw;font-weight:700;color:var(--gold);line-height:1;min-width:3vw;opacity:.8}
        .info-row .row-content{font-size:.95vw;line-height:1.5;color:var(--gray);font-weight:400;padding-top:.2vh}
        .info-row .row-content strong{color:var(--navy);font-weight:700}

        .split-layout{display:flex;gap:3vw;width:100%;align-items:stretch;height:100%}
        .split-left{flex:1.2;display:flex;flex-direction:column;justify-content:center}
        .split-right{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}

        .quote-block{
            background:linear-gradient(135deg,var(--navy-deep),var(--navy));
            color:#fff;border-radius:12px;padding:3.5vh 2vw;position:relative;overflow:hidden;
            animation:fadeUp .6s .3s both;width:100%;
        }
        .quote-block::before{content:"\201C";font-family:'Playfair Display',serif;font-size:8vw;position:absolute;top:-3vh;right:1vw;opacity:.15;color:var(--gold);line-height:1}
        .quote-block .quote-text{font-family:'Playfair Display',serif;font-size:1.2vw;line-height:1.5;font-weight:600;font-style:italic;max-width:90%;position:relative;z-index:2}
        .quote-block .quote-source{margin-top:2vh;font-size:.8vw;color:var(--gold-bright);letter-spacing:.05em;text-transform:uppercase}

        .stat-block{text-align:center;padding:3vh 2vw;background:#fff;border:1px solid #e2e8f0;border-radius:12px;width:100%}
        .stat-block .stat-num{font-family:'Playfair Display',serif;font-size:3vw;font-weight:800;color:var(--navy);line-height:1}
        .stat-block .stat-label{font-size:.9vw;color:var(--gray-soft);margin-top:1vh;letter-spacing:.05em;text-transform:uppercase}

        .img-container{
            background:#1a2a3e;
            border-radius:10px;border:1px solid #e2e8f0;
            overflow:hidden;display:flex;align-items:center;justify-content:center;
            position:relative;
        }
        .slide-img{
            width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1;
        }

        .img-row-portrait{
            display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2vw;
            margin:0 auto 2vh auto;
            height:40vh;
            width:calc(79% - 300px);
        }

        .side-img-layout{display:flex;gap:2.5vw;width:100%;height:100%;align-items:center}
        .side-img-wrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center;animation:fadeUp .5s .2s both}
        .side-img-wrap.landscape{height:30vh;width:50vh}
        .side-img-wrap.square{height:38vh;width:38vh}
        .side-cards-wrap{flex:1;display:flex;align-items:center}

        .controls{
            position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
            display:flex;gap:12px;align-items:center;
            background:rgba(8,13,22,.9);backdrop-filter:blur(12px);
            padding:10px 20px;border-radius:50px;color:#fff;z-index:100;
            font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);
            animation:fadeUp .6s .8s both;border:1px solid rgba(255,255,255,.06);
        }
        .controls button{
            background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06);
            color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;
            font-size:16px;transition:.2s;display:flex;align-items:center;justify-content:center;
        }
        .controls button:hover{background:var(--accent);transform:scale(1.1)}
        .controls .counter{min-width:60px;text-align:center;letter-spacing:.05em;font-family:'JetBrains Mono',monospace}
        .controls .fs{width:auto;padding:0 16px;border-radius:20px;font-size:13px}

        .progress-bar{position:absolute;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--navy),var(--gold));transition:width .6s ease;z-index:10}
        .hint{position:fixed;top:16px;right:20px;color:#7a8aa0;font-size:12px;background:rgba(0,0,0,.4);padding:6px 12px;border-radius:20px;z-index:50;animation:fadeIn .6s 1s both;transition:opacity .5s}
        .hint.hide{opacity:0;pointer-events:none}

        @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
    </style>
</head>
<body>

<div class="hint">← → / Space · F — полноэкранный режим</div>
<div class="deck" id="deck"></div>

<div class="controls">
    <button id="prev" title="Назад">‹</button>
    <span class="counter" id="counter">1 / 14</span>
    <button id="next" title="Вперёд">›</button>
    <button class="fs" id="fs">⛶ Полный экран</button>
</div>

<script>
    const slides = [
        { type: 'title',
            title: 'Обеспечение права работников на защиту своего достоинства в период трудовой деятельности',
            subtitle: 'Трудовое право • ФИО, группа, курс',
            topic: 'Трудовое право'
        },
        {
            title: 'Актуальность темы', tag: 'Контекст', bg: 'bg-s2', layout: 'cards', cols: 1,
            content: [
                { icon: '01 // КОНСТИТУЦИЯ', title: 'Конституционная ценность', text: 'Достоинство личности — основа правового статуса человека (ст. 21 Конституции РФ). Государство обязано его защищать.' },
                { icon: '02 // НЕРАВЕНСТВО', title: 'Слабая сторона', text: 'Работник находится в экономической зависимости от работодателя, что требует повышенной защиты его нематериальных благ.' },
                { icon: '03 // РАСПРОСТРАНЁННОСТЬ', title: 'Распространённость нарушений', text: 'Моббинг, хамство и унижения на рабочих местах — частые явления, требующие правового регулирования.' }
            ]
        },
        {
            title: 'Понятие «достоинство»', tag: 'Определение', bg: 'bg-s3', layout: 'split',
            leftContent: `
      <div class="info-list">
        <div class="info-row"><div class="row-num">I</div><div class="row-content"><strong>Гражданское право:</strong> Достоинство — это самооценка личности, неотчуждаемое нематериальное благо (ст. 150 ГК РФ).</div></div>
        <div class="info-row"><div class="row-num">II</div><div class="row-content"><strong>Трудовое право:</strong> Право на уважительное отношение со стороны работодателя и коллектива, защита от унижения.</div></div>
        <div class="info-row"><div class="row-num">III</div><div class="row-content"><strong>Связь с принципами:</strong> Равенство, запрет дискриминации, свобода труда создают основу для защиты достоинства.</div></div>
      </div>`,
            rightContent: `
      <div class="img-container" data-name="picture-2" style="height:32vh;width:100%;">
        <img src="picture-2.jpg" alt="picture-2" class="slide-img" onerror="this.style.display='none'">
      </div>
      <div class="quote-block">
        <div class="quote-text">«Достоинство личности охраняется государством. Ничто не может быть основанием для его умаления.»</div>
        <div class="quote-source">— Статья 21, Конституция РФ</div>
      </div>`
        },
        {
            title: 'Нормативная база', tag: 'Правовая база', bg: 'bg-s4', layout: 'cards', cols: 2,
            imagesPortrait: ['picture-3.jpg', 'picture-4.jpg', 'picture-5.jpg'],
            content: [
                { icon: ' КОНСТИТУЦИЯ //', title: 'Конституция РФ', text: 'Ст. 21 — защита достоинства; Ст. 37 — свобода труда и безопасные условия.' },
                { icon: ' ТРУДОВОЙ КОДЕКС //', title: 'Трудовой кодекс РФ', text: 'Ст. 2 (принципы), Ст. 3 (запрет дискриминации), Ст. 237 (моральный вред).' },
                { icon: ' ГРАЖДАНСКИЙ КОДЕКС //', title: 'Гражданский кодекс РФ', text: 'Ст. 150–152 — защита чести, достоинства и деловой репутации работника.' },
                { icon: ' СУД //', title: 'Пленум ВС РФ', text: 'Постановление № 10 от 24.02.2005 «О защите чести и достоинства».' }
            ]
        },
        {
            title: 'Место в системе принципов', tag: 'Принципы', bg: 'bg-s5', layout: 'split',
            leftContent: `
      <div class="info-list">
        <div class="info-row"><div class="row-num">01</div><div class="row-content"><strong>Отраслевые принципы (ст. 2 ТК РФ):</strong> Защита достоинства связана с запретом принудительного труда и дискриминации.</div></div>
        <div class="info-row"><div class="row-num">02</div><div class="row-content"><strong>Межотраслевой характер:</strong> Принцип объединяет нормы конституционного, трудового и гражданского права.</div></div>
        <div class="info-row"><div class="row-num">03</div><div class="row-content"><strong>Системная связь:</strong> Обеспечивает гуманизацию труда и защиту личности от производственного произвола.</div></div>
      </div>`,
            rightContent: `
      <div class="img-container" data-name="picture-6" style="height:44vh;width:44vh;">
        <img src="picture-6.jpg" alt="picture-6" class="slide-img" onerror="this.style.display='none'">
      </div>
      <div class="stat-block">
        <div class="stat-num">3</div>
        <div class="stat-label">Отрасли права</div>
        <div style="font-size:.85vw;color:var(--gray);margin-top:2vh;line-height:1.5">Конституционное, Трудовое и Гражданское право совместно формируют механизм защиты.</div>
      </div>`
        },
        {
            title: 'Содержание принципа', tag: 'Содержание', bg: 'bg-s6', layout: 'cards', cols: 3,
            content: [
                { icon: ' УВАЖЕНИЕ //', title: 'Уважительное отношение', text: 'Обеспечение корректного поведения со стороны руководства и коллег.' },
                { icon: ' ЗАЩИТА //', title: 'Защита от оскорблений', text: 'Недопустимость угроз, клеветы и унижающих действий в адрес работника.' },
                { icon: ' ДИСЦИПЛИНА //', title: 'Дисциплинарные меры', text: 'Запрет на унижающие формы взысканий и публичные порицания.' },
                { icon: ' ЛИЧНОЕ //', title: 'Частная жизнь', text: 'Защита персональных данных и невмешательство в личную сферу.' },
                { icon: ' ОПРОВЕРЖЕНИЕ //', title: 'Опровержение', text: 'Право требовать опровержения порочащих и недостоверных сведений.' },
                { icon: ' КОМПЕНСАЦИЯ //', title: 'Моральный вред', text: 'Право на компенсацию за причинённые нравственные страдания.' }
            ]
        },
        {
            title: 'Формы нарушения', tag: 'Нарушения', bg: 'bg-s7', layout: 'side-img',
            sideImage: { src: 'picture-7.jpg', shape: 'landscape' },
            content: [
                { icon: ' МОББИНГ //', title: 'Моббинг', text: 'Систематический психологический террор со стороны коллектива (травля).' },
                { icon: ' БОССИНГ //', title: 'Боссинг', text: 'Давление, оскорбления и самоуправство со стороны руководителя.' },

                { icon: ' АДМИНИСТРАТИВНО //', title: 'Административные органы', text: 'Жалобы в Государственную инспекцию труда (ГИТ) и органы прокуратуры.' },

            ]
        },
        {
            title: 'Моральный вред', tag: 'Компенсация', bg: 'bg-s9', layout: 'split',
            leftContent: `
      <div class="info-list">
        <div class="info-row"><div class="row-num">§1</div><div class="row-content"><strong>Основание (ст. 237 ТК РФ):</strong> Возмещение морального вреда при нарушении трудовых прав.</div></div>
        <div class="info-row"><div class="row-num">§2</div><div class="row-content"><strong>Определение размера:</strong> Суд учитывает характер страданий, вину работодателя и обстоятельства.</div></div>
        <div class="info-row"><div class="row-num">§3</div><div class="row-content"><strong>Критерии:</strong> Требования разумности и справедливости; возможна компенсация без имущественного ущерба.</div></div>
      </div>`,
            rightContent: `
      <div class="stat-block">
        <div class="stat-num">∞</div>

        <div style="font-size:.85vw;color:var(--gray);margin-top:2vh;line-height:1.5">Моральный вред может быть компенсирован даже если работник не понёс прямых финансовых потерь.</div>
      </div>`
        },
        {
            title: 'Судебная практика', tag: 'Практика', bg: 'bg-s10', layout: 'cards', cols: 2,
            content: [
                { icon: ' ДЕЛО 01 //', title: 'Увольнение с унижением', text: 'Восстановление на работе, если приказ об увольнении оформлен с унижением чести.' },
                { icon: ' ДЕЛО 02 //', title: 'Служебная переписка', text: 'Иски за оскорбления в корпоративной электронной почте и мессенджерах.' },
                { icon: ' ДЕЛО 03 //', title: 'Незаконные взыскания', text: 'Взыскание компенсации за моральный вред при незаконных дисциплинарных взысканиях.' },
                { icon: ' ДОКАЗАТЕЛЬСТВА //', title: 'Доказательства', text: 'Ключевую роль играют аудиозаписи, скриншоты переписок и показания свидетелей.' }
            ]
        },
        {
            title: 'Проблемы реализации', tag: 'Проблемы', bg: 'bg-s11', layout: 'cards', cols: 2,
            content: [
                { icon: ' ДОКАЗЫВАНИЕ //', title: 'Сложность доказывания', text: 'Психологическое давление (моббинг) трудно подтвердить объективными доказательствами.' },
                { icon: ' СТРАХ //', title: 'Страх потери места', text: 'Работники часто мирятся с унижениями из-за страха увольнения и потери дохода.' },
                { icon: ' ПРОБЕЛЫ //', title: 'Пробелы в ТК РФ', text: 'Отсутствие прямых определений понятий «моббинг» и «харассмент» в кодексе.' },
                { icon: ' СУММЫ //', title: 'Малые компенсации', text: 'Суды часто присуждают незначительные суммы компенсаций морального вреда.' }
            ]
        },
        {
            title: 'Пути решения', tag: 'Решения', bg: 'bg-s12', layout: 'cards', cols: 2,
            content: [
                { icon: ' ЗАКОН //', title: 'Изменение ТК РФ', text: 'Закрепить легальные понятия «моббинг», «харассмент» и ответственность за них.' },
                { icon: ' ОТВЕТСТВЕННОСТЬ //', title: 'Ответственность', text: 'Усилить санкции для работодателей за систематические нарушения достоинства.' },
                { icon: ' ЭТИКА //', title: 'Корпоративная этика', text: 'Внедрение антимоббинговых политик внутри организаций и обучение руководителей.' },
                { icon: ' МЕДИАЦИЯ //', title: 'Развитие медиации', text: 'Широкое применение медиативных процедур для разрешения трудовых конфликтов.' }
            ]
        },
        {
            title: 'Выводы', tag: 'Итоги', bg: 'bg-s13', layout: 'split',
            leftContent: `
      <div class="info-list">
        <div class="info-row"><div class="row-num">✓</div><div class="row-content"><strong>Правовая природа:</strong> Право на защиту достоинства — межотраслевой конституционный и отраслевой принцип.</div></div>
        <div class="info-row"><div class="row-num">✓</div><div class="row-content"><strong>Защита:</strong> Осуществляется через самозащиту, ГИТ, прокуратуру, профсоюзы и судебные органы.</div></div>
        <div class="info-row"><div class="row-num">✓</div><div class="row-content"><strong>Инструмент:</strong> Ключевым механизмом остаётся компенсация морального вреда (ст. 237 ТК РФ).</div></div>
      </div>`,
            rightContent: `
      <div class="quote-block">
        <div class="quote-text">«Развитие законодательства и судебной практики необходимо для реальной защиты достоинства в сфере труда.»</div>
        <div class="quote-source">— Итог исследования</div>
      </div>`
        },
        {
            title: 'Список литературы', tag: 'Источники', bg: 'bg-s14', layout: 'list',
            content: [
                { text: 'Конституция Российской Федерации.' },
                { text: 'Трудовой кодекс Российской Федерации.' },
                { text: 'Гражданский кодекс Российской Федерации.' },
                { text: 'Постановление Пленума ВС РФ № 10 от 24.02.2005 «О защите чести и достоинства».' }
            ]
        }
    ];

    const deck = document.getElementById('deck');
    const counter = document.getElementById('counter');
    const hint = document.querySelector('.hint');
    let current = 0;
    let isAnimating = false;

    function render(){
        deck.innerHTML = '';
        slides.forEach((s,i)=>{
            const el = document.createElement('section');
            el.className = 'slide' + (s.type==='title'?' title':' content');
            el.dataset.index = i;

            let html = '';
            if(s.type === 'title'){
                html = `
        <div class="bg-pattern"></div>
        <div class="glow1"></div>
        <div class="glow2"></div>
        <div class="title-eyebrow">${s.topic}</div>
        <h1>${s.title}</h1>
        <div class="ribbon"></div>
        <div class="subtitle">${s.subtitle}</div>
        <div class="footer-row">
          <span>Трудовое право • 2026</span>
          <span>0${i+1} / ${slides.length}</span>
        </div>`;
            } else {
                let bodyHtml = `<div class="bg-layer ${s.bg}"></div>`;
                bodyHtml += `<div class="content-header"><div class="slide-num">0${i+1}</div><h2>${s.title}</h2><div class="tag">${s.tag}</div></div>`;
                bodyHtml += `<div class="content-body">`;

                if(s.imagesPortrait && s.imagesPortrait.length > 0){
                    bodyHtml += `<div class="img-row-portrait">`;
                    s.imagesPortrait.forEach(src => {
                        const name = src.replace(/\.(jpg|png|jpeg|gif|webp)/i, '');
                        bodyHtml += `<div class="img-container" data-name="${name}"><img src="${src}" alt="${name}" class="slide-img" onerror="this.style.display='none'"></div>`;
                    });
                    bodyHtml += `</div>`;
                }

                if(s.layout === 'cards'){
                    bodyHtml += `<div class="card-grid cols-${s.cols}">`;
                    s.content.forEach((c, idx) => {
                        bodyHtml += `<div class="card" style="animation-delay:${0.3 + idx*0.1}s">
            <div class="card-icon">${c.icon}</div>
            <div class="card-title">${c.title}</div>
            <div class="card-text">${c.text}</div>
          </div>`;
                    });
                    bodyHtml += `</div>`;
                } else if(s.layout === 'side-img'){
                    const shape = s.sideImage.shape;
                    const src = s.sideImage.src;
                    const name = src.replace(/\.(jpg|png|jpeg|gif|webp)/i, '');
                    bodyHtml += `<div class="side-img-layout">
          <div class="side-img-wrap ${shape}">
            <div class="img-container" data-name="${name}" style="width:100%;height:100%;">
              <img src="${src}" alt="${name}" class="slide-img" onerror="this.style.display='none'">
            </div>
          </div>
          <div class="side-cards-wrap">
            <div class="card-grid cols-1" style="gap:1.2vh">`;
                    s.content.forEach((c, idx) => {
                        bodyHtml += `<div class="card" style="animation-delay:${0.3 + idx*0.1}s;padding:1.4vh 1.5vw">
            <div class="card-icon">${c.icon}</div>
            <div class="card-title">${c.title}</div>
            <div class="card-text">${c.text}</div>
          </div>`;
                    });
                    bodyHtml += `</div></div></div>`;
                } else if(s.layout === 'split'){
                    bodyHtml += `<div class="split-layout">
          <div class="split-left">${s.leftContent}</div>
          <div class="split-right">${s.rightContent}</div>
        </div>`;
                } else if(s.layout === 'list'){
                    bodyHtml += `<div class="info-list">`;
                    s.content.forEach((c, idx) => {
                        bodyHtml += `<div class="info-row" style="animation-delay:${0.3 + idx*0.1}s">
            <div class="row-num">${idx+1}</div>
            <div class="row-content">${c.text}</div>
          </div>`;
                    });
                    bodyHtml += `</div>`;
                }

                bodyHtml += `</div>`;
                bodyHtml += `<div class="progress-bar" style="width:${((i+1)/slides.length)*100}%"></div>`;
                html = bodyHtml;
            }
            el.innerHTML = html;
            deck.appendChild(el);
        });
        show(current, true);
    }

    function show(i, instant){
        if(isAnimating && !instant) return;
        const next = (i+slides.length)%slides.length;
        if(next === current && !instant) return;

        const oldEl = deck.querySelector('.slide.active');
        const newEl = deck.children[next];

        if(instant){
            if(oldEl) oldEl.classList.remove('active');
            newEl.classList.add('active');
            current = next;
            counter.textContent = `${current+1} / ${slides.length}`;
            return;
        }

        isAnimating = true;

        if(oldEl){
            oldEl.classList.remove('active');
            oldEl.classList.add(next > current ? 'exit-left' : 'exit-right');
            setTimeout(()=>{ oldEl.classList.remove('exit-left','exit-right'); }, 400);
        }

        setTimeout(()=>{
            newEl.classList.add('active');
            current = next;
            counter.textContent = `${current+1} / ${slides.length}`;
            isAnimating = false;
        }, 150);
    }

    document.getElementById('prev').onclick = ()=>show(current-1);
    document.getElementById('next').onclick = ()=>show(current+1);
    document.getElementById('fs').onclick = ()=>{
        if(!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    };

    document.addEventListener('keydown',e=>{
        if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){show(current+1);e.preventDefault();}
        if(e.key==='ArrowLeft'||e.key==='PageUp'){show(current-1);}
        if(e.key==='Home') show(0);
        if(e.key==='End') show(slides.length-1);
        if(e.key==='f'||e.key==='F') document.getElementById('fs').click();
    });

    let touchX=null;
    document.addEventListener('touchstart',e=>touchX=e.touches[0].clientX);
    document.addEventListener('touchend',e=>{
        if(touchX===null) return;
        const dx=e.changedTouches[0].clientX-touchX;
        if(Math.abs(dx)>50) show(current+(dx<0?1:-1));
        touchX=null;
    });

    setTimeout(()=>hint.classList.add('hide'), 5000);
    render();
</script>
</body>
</html>
